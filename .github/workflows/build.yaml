name: Build
run-name: Build, test, and package ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rebuilds on an unchanged tree so the image picks up base-image
  # security updates.  FROM ubuntu:26.04 re-resolves and apt-get upgrade
  # runs on a fresh runner with no layer cache, so this is a real rebuild.
  schedule:
    # Off the hour deliberately - scheduled runs queue heavily at :00.
    # UTC.  Note GitHub disables scheduled workflows after 60 days with
    # no repository activity, and emails the owner when it does.
    - cron: '47 9 * * *'
  # A manual trigger, for when a runner, Conan Center, or the registry
  # was down rather than the code being wrong.
  workflow_dispatch:

# A newer push to a pull request supersedes the run in progress.  Runs on
# main are never cut off: one that is already pushing should finish
# rather than leave a tag half-written.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONTAINER_NAME: ueventanalysistoolbackend
  QUAY_DIRECTORY: ueventanalysistoolbackend
  BUILD_TYPE: Release
  # Whatever clang the image ships.  The language version is what the
  # code depends on, and that is pinned below with compiler.cppstd.
  CC: clang
  CXX: clang++

jobs:
  # The SQL suite, in parallel with the build: a minute against an hour,
  # so it costs nothing.  The integration tests wait on it, so a schema
  # problem is reported as one instead of as C++ tests failing.
  database:
    name: Database
    uses: ./.github/workflows/database.yaml

  build:
    runs-on: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-26.04]
    name: Build on ${{ matrix.distro }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install conan

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build-environment

      # gRPC, Boost, and OpenTelemetry from source take most of an hour,
      # so the Conan cache is what makes this pipeline usable.  The key
      # covers the image and the compiler: a new clang in the image
      # means different binaries, and --build=missing rebuilds them.
      - name: Compute Conan cache key
        id: conan-key
        run: |
          compiler=$(${CXX} -dumpversion)
          echo "key=conan-${{ matrix.distro }}-clang${compiler}-${BUILD_TYPE}-${{ hashFiles('conanfile.py') }}" >> "${GITHUB_OUTPUT}"

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          key: ${{ steps.conan-key.outputs.key }}

      - name: Create default profile with Ninja generator
        run: |
          conan profile detect --force
          {
            echo ""
            echo "[conf]"
            echo "tools.cmake.cmaketoolchain:generator=Ninja"
          } >> ~/.conan2/profiles/default
          cat ~/.conan2/profiles/default

      - name: Install Conan dependencies
        run: |
          conan install . --build=missing \
                -s:a build_type=${BUILD_TYPE} \
                -s:a compiler.cppstd=23 \
                --output-folder .

      # Saved straight after the install, not at the end of the job: the
      # cache action only saves on success, and a failing build must not
      # throw away an hour of dependency builds.
      - name: Save Conan cache
        if: ${{ steps.conan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          key: ${{ steps.conan-key.outputs.key }}

      # clang-tidy runs as part of the compile, so a lint error fails the
      # build.  version.hpp is generated into the build directory, so it
      # travels with the artifact - nothing to copy.
      - name: Configure preset and build
        run: |
          cmake --preset conan-release -DWITH_CONAN=ON -DUSE_CLANG_TIDY=ON -DBUILD_CONTAINER=ON
          cmake --build --preset conan-release
          cp CMakeUserPresets.json build

      - name: Upload build directory
        uses: ./.github/actions/upload-build-directory

  test:
    needs: [build, database]
    runs-on: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-26.04]
    name: Test on ${{ matrix.distro }}

    # A throwaway server for the [.integration] tests.  The official
    # image authenticates TCP with scram-sha-256, as production does.
    services:
      postgres:
        image: postgres:18
        env:
          # Not a secret: this server lives for one job and is reachable
          # only from the runner.
          POSTGRES_PASSWORD: postgres
        # Not 5432 on the host: the runner image ships a PostgreSQL of
        # its own that may already hold it, and then the tests would
        # quietly talk to the wrong server.
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The tests read testing/data and create.sh reads scripts/database
      # from the source tree, at the same path the build job compiled in.
      - uses: actions/checkout@v6

      - name: Prepare test environment
        uses: ./.github/actions/prepare-test-environment

      - name: Download build directory
        uses: ./.github/actions/download-build-directory

      - name: Run unit tests
        run: |
          mv build/CMakeUserPresets.json ./
          ./build/Release/unitTests

      # The roles' passwords are made per run and masked; the schema is
      # built by the same script a deployment uses.  This and the
      # integration tests run even if the unit tests failed, so one
      # run reports both.
      - name: Create the test database
        if: ${{ !cancelled() }}
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          rw_password=$(openssl rand -hex 24)
          ro_password=$(openssl rand -hex 24)
          echo "::add-mask::${rw_password}"
          echo "::add-mask::${ro_password}"
          UEATDB_RW_USER=ueat_ci_rw UEATDB_RW_PASSWORD=${rw_password} \
          UEATDB_RO_USER=ueat_ci_ro UEATDB_RO_PASSWORD=${ro_password} \
            scripts/database/create.sh ueatdb_ci
          echo "UEAT_TEST_DB_PASSWORD=${rw_password}" >> "${GITHUB_ENV}"

      # Logs in, changes passwords, and steps up against a real schema.
      # The backend role is what the authorities connect as; the
      # superuser only seeds and removes the test users.
      - name: Run integration tests
        if: ${{ !cancelled() }}
        env:
          UEAT_TEST_DB_HOST: localhost
          UEAT_TEST_DB_PORT: '55432'
          UEAT_TEST_DB_NAME: ueatdb_ci
          UEAT_TEST_DB_USER: ueat_ci_rw
          UEAT_TEST_DB_SUPERUSER: postgres
          UEAT_TEST_DB_SUPERUSER_PASSWORD: postgres
        run: ./build/Release/unitTests "[integration]"

  # Only what reached main, or a scheduled or manual rebuild of it, is
  # published.  A pull request never pushes an image - and could not:
  # the registry secrets are withheld from pull requests from forks.
  package:
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-26.04]
    name: Package on ${{ matrix.distro }}

    steps:
      - uses: actions/checkout@v6

      - name: Prepare package environment
        uses: ./.github/actions/prepare-package-environment

      - name: Download build directory
        uses: ./.github/actions/download-build-directory

      - name: Package tgz
        run: |
          mv build/CMakeUserPresets.json ./
          cd build/Release
          mkdir -p artifacts
          cpack -B artifacts -G TGZ

      - name: Build and push image
        env:
          QUAY_ROBOT_PASSWORD: ${{ secrets.QUAY_ROBOT_PASSWORD }}
          QUAY_ROBOT_USER: ${{ secrets.QUAY_ROBOT_USER }}
        run: |
          set -euo pipefail
          echo "${QUAY_ROBOT_PASSWORD}" | buildah login -u "${QUAY_ROBOT_USER}" --password-stdin quay.io
          cd build/Release
          cp artifacts/*.tar.gz ./
          version=$(ls *.tar.gz | sed 's/uEventAnalysisToolBackend-//g' | sed 's/-Linux.tar.gz//g')
          echo "Will build container version ${version}"
          # The commit rides along as a label, so an image can be traced
          # to its source without another tag.
          buildah bud --label org.opencontainers.image.revision=${GITHUB_SHA} \
                      -t ${CONTAINER_NAME}:${version} -t ${CONTAINER_NAME}:latest \
                      -f ./Dockerfile.u26
          # Two names for one image.  The plain version tag is what the
          # Deployment references and what imagePullPolicy: Always
          # follows; the dated one never appears in a manifest and exists
          # so a running pod's digest can be traced to a build, and so
          # yesterday's image is still reachable if a base update breaks
          # something.
          dated="${version}-$(date -u +%Y%m%d)"
          buildah tag ${CONTAINER_NAME}:${version} quay.io/uuss/${QUAY_DIRECTORY}:${version}
          buildah tag ${CONTAINER_NAME}:${version} quay.io/uuss/${QUAY_DIRECTORY}:${dated}
          # Retry a transient registry failure, but FAIL the step when
          # every attempt fails.  A loop that just falls through leaves a
          # green pipeline and a stale tag in the registry, which looks
          # exactly like a working deploy until something reads the
          # binary.
          push_tag() {
            for i in 1 2 3; do
              buildah push "$1" && return 0
              echo "Push of $1 failed (attempt $i); retrying"
              sleep 15
            done
            echo "ERROR: could not push $1 after 3 attempts"
            return 1
          }
          push_tag quay.io/uuss/${QUAY_DIRECTORY}:${version}
          push_tag quay.io/uuss/${QUAY_DIRECTORY}:${dated}
