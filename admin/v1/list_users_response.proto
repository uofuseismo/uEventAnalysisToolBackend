edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

/**
 * The list of users.
 */
message ListUsersRequest {
   // Defines the access level of a user.
   enum Access {
      // The default value.  This value is unused.
      ACCESS_UNSPECIFIED = 0;
      // The user has read-only permission.
      ACCESS_READ_ONLY = 1;
      // The user has read-write permissions.
      ACCESS_READ_WRITE = 2;
   }

   // Defines the access level per region.
   message RegionAccess {
      // The region name - e.g., utah, yellowstone, forge.
      string region = 1;
      // The access level.
      Access acces = 2;
   }
        
   message User {
      // The user name.
      string name = 1; 
      // The access (per region). 
}
