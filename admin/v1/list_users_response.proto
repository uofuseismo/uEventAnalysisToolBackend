edition = "2023";
import "google/protobuf/timestamp.proto";
import "uEventAnalysisToolAPI/admin/v1/permission.proto";

package UEventAnalysisToolAPI.Admin.V1;

/**
 * Lists the users in a system for administrative purpsoes.
 * Note, if a field is prefaced by "MAY BE UNSET" then the client
 * should check before using e.g.,
 *    C++:        has_last_login();
 *    TypeScript: lastLogin !== undefined
 *    Dart:       hasLastLogin()
 */
message ListUsersResponse {
   // A user's access to one schema.  Every field is always set.
   message SchemaPermission {
      // The schema, e.g., utah, ynp, forge, etc.
      string schema = 1;
      // The privileges in that schema.  Never PERMISSION_NOT_SPECIFIED.
      Permission permission = 2;
      // When this permission was granted or last changed.  ALWAYS SET.
      google.protobuf.Timestamp granted = 3;
   }

   // A key the user may log in with, unless it has expired.
   message ActiveKey {
      // The user's label for the key, e.g., laptop.  Unique per user.
      string name = 1;
      // The signature algorithm, e.g., ed25519.
      string algorithm = 2;
      // SHA-256 fingerprint of the public key, e.g., SHA256:3q2+7w...
      // Enough to tell keys apart; the key itself is not sent.
      string fingerprint = 3;
      // When the key was registered.  ALWAYS SET.
      google.protobuf.Timestamp created = 4;
      // When the key stops working.  MAY BE UNSET: unset means it
      // never expires.  A time in the past means it has expired.
      google.protobuf.Timestamp expires = 5;
      // When the key was last used to log in.  MAY BE UNSET: unset
      // means it has never been used.
      google.protobuf.Timestamp last_used = 6;
   }

   // A key that can no longer be used either because it has expired or
   // because it was revoked.  Kept as an audit trail.
   message InactiveKey {
      enum Reason {
         // No reason provided as to why the key is invalid. 
         REASON_NOT_SPECIFIED = 0;
         // The key was revoked.
         REASON_REVOKED = 1;
         // The key has expired.
         REASON_EXPIRED = 2;
      }
      // The user's label for the key, e.g., laptop.
      string name = 1;
      // The signature algorithm, e.g., ed25519.
      string algorithm = 2;
      // SHA-256 fingerprint of the public key.
      string fingerprint = 3;
      // When the key was registered.  ALWAYS SET.
      google.protobuf.Timestamp created = 4;
      // When the key was invalidated.  ALWAYS SET. 
      // Note, if a key expired and was then revoked then this
      // is when the key expired - i.e., the earlier of the two.
      google.protobuf.Timestamp invalidated = 5;
      // When the key was last used to log in.  MAY BE UNSET: unset
      // means it was never used.
      google.protobuf.Timestamp last_used = 6;
      // The reason the key is invalid.
      Reason reason = 7;
   }

   // This is a user that has been added and has successfully changed
   // their password.
   message ActiveUser {
      // The user name.
      string name = 1; 
      // True indicates the user is an administrator.
      bool administrator = 2;
      // When the account was created.
      google.protobuf.Timestamp created = 3;
      // When the user last set their password.
      google.protobuf.Timestamp password_updated = 4;
      // The last time this user logged in by password or by key.
      // This MAY BE UNSET - in this the unset case the user has not yet
      // logged in since replacing their issued password (hence, replacing
      // an issued password is not a login).
      google.protobuf.Timestamp last_login = 5;
      // The schemas the user may access.  This can be empty.
      repeated SchemaPermission permissions = 6;
      // The keys the user may log in with.  This can be empty.
      repeated ActiveKey active_keys = 7;
      // The keys the user may not longer log in with.  This can be empty.
      repeated InactiveKey inactive_keys = 8;
   }

   // This is a user that has not yet activated their account.
   message ProvisionalUser {
      // The user name
      string name = 1;
      // True indicates this is a provisional administrator.
      bool administrator = 2;
      // When the account was created.
      google.protobuf.Timestamp created = 3;
      // When the provisional status expires.
      google.protobuf.Timestamp expiration = 4;
      // True indicates that the expiration has passed and the user is locked
      // out until an administrator resets their password.
      bool expired = 5;
      // True indicates a reset of a previously active user.  
      // False indicates a new user who never yet had a password of their own.
      bool password_reset = 6;
      // The last time this user logged in.  This MAY BE UNSET - in particular
      // this is always unset for a new user or, for a reset user, if they
      // have yet to log in even prior to the reset.
      google.protobuf.Timestamp last_login = 7;
      // The keys the user will be able to log in with.  This may be empty.
      repeated ActiveKey active_keys = 9;
      /// The user's inactive keys.  May be empty.  A reset that revoked
      /// the user's keys leaves them here.
      repeated InactiveKey inactive_keys = 10;
   }

   // The active users.
   repeated ActiveUser active_users = 1;
   // The provisional users.
   repeated ProvisionalUser provisional_users = 2; 
   // Further information on request.
   string details = 3 [default = ""];
}
