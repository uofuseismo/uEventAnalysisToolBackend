edition = "2023";

package UEventAnalysisToolAPI.Admin.V1;

/// The permission to grant to the user in the schema.
enum Permission {
   /// No permissions specified - this result in an error.
   PERMISSION_NOT_SPECIFIED = 0;
   /// Provide the user read-only privileges.
   PERMISSION_READ_ONLY = 1;
   /// Provide the user read-write privileges.
   PERMISSION_READ_WRITE = 2;
}   
