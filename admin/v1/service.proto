/**
 * Facilitates user management by administrators.
 */
service AdminService {
   // Lists the users.
   rpc ListUsers(ListUsersRequest) returns(ListUsersResponse) {};
   // Allows a user to step-up privileges to admin and execute the other
   // RPCs in this serivce.
   rpc LoginWithPassword(LoginWithPasswordRequest) returns(LoginWithPasswordResponse) {};
   // Creates a user.
   rpc CreateUser(CreateUserRequest) returns(CreateUserResponse) {};
   // Deletes a user.
   rpc DeleteUser(DeleteUserRequest) returns(DeleteUserResponse) {}; 
   // Resets a user's password.
