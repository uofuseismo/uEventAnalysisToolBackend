edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

/**
 * Allows the user to updates their psasword.  The user name is passed
 * through the JWT token.
 */
message ChangePasswordRequest {
   // The current password (plain text).
   string old_password = 1;
   // The new password (plain text).
   string new_password = 2;
}
