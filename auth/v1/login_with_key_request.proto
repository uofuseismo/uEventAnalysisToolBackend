edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

/**
 * User login request with an ed25519 public key.
 */
message LoginWithKeyRequest {
   // The user's PUBLIC key.  This should be length 32U. 
   bytes public_key = 1;
   // A compact JSON Web Signature signed by the client using the
   // EdDSA algorithm.
   string assertion = 2;
   // The frontend version.
   string version = 3;
}

