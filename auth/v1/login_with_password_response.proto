edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

/**
 * Defines a response to a basic login request.
 */
message LoginWithPasswordResponse {
   // The (signed) JSON web token.  This token should be passed by the user in
   // the subsequent requests via the Authorization HTTP header as a Bearer
   // credential.  The client can extract its claims from this token but should
   // not tamper this token as it is signed by the server.
   string json_web_token = 1;
   // Further details accompanying the login request.
   string details = 2;
}
