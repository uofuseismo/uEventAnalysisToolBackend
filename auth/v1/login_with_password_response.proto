edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

/**
 * Defines a response to a basic login request.
 */
message LoginWithPasswordResponse {
   // The identifier corresponding to the input request identifier.
   string identifier = 1;
   // The (signed) JSON web token.  This token should be passed by the user in
   // the subsequent requests in headers i.e., the Bearer <jwt> - HTTP Header
   // field.  The client can extract its claims from this token.
   string json_web_token = 2;
   // Further details accompanying the login request.
   string details = 3;
}
