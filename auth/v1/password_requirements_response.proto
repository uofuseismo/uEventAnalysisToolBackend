edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

/**
 * The requirements for a new password. 
 */
message PasswordRequirementsResponse {
   // The identifier corresponding to the request.
   string identifier = 1 [default = ""];
   // The minimum password length.
   uint32 minimum_password_length = 2;
   // The new password requires a number.
   bool requires_number = 3;
   // The new password must have a special character (something other than
   // a letter or digit).
   bool requires_special_character = 4;
   // The new and old password must differ.
   bool new_and_old_password_must_differ = 5;
}

