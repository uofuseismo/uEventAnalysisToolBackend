edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

import "uEventAnalysisToolAPI/auth/v1/change_password_request.proto";
import "uEventAnalysisToolAPI/auth/v1/change_password_response.proto";
import "uEventAnalysisToolAPI/auth/v1/login_with_password_request.proto";
import "uEventAnalysisToolAPI/auth/v1/login_with_password_response.proto";
import "uEventAnalysisToolAPI/auth/v1/password_requirements_request.proto";
import "uEventAnalysisToolAPI/auth/v1/password_requirements.proto";

/**
 * Handles a basic login requests for a user.  
 */
service AuthService {
   // Allows the user to change their password.  This requires the original
   // password.
   rpc ChangePassword(ChangePasswordRequest) returns(ChangePasswordResponse) {}; 
   // Log-in with basic credentials request.  In this case the client will pass
   // their credentials in the HTTP Authorization: Basic asdf8942kd2= field
   // where the user name and password (asdf8942kd2=0 is the base64 encoded
   // string of the form user:password  
   rpc LoginWithPassword(LoginWithPasswordRequest) returns(LoginWithPasswordResponse) {};
   // Defines the password criteria for the frontend to help the user successfully
   // change their password.
   rpc GetPasswordRequirements(PasswordRequirementsRequest) returns(PasswordRequirements) {};
   // Log-in with a key.  In this case the client will pass their key via
   // the message payload. 
   //rpc LoginWithKey(LoginWithKeyRequest) returns(LoginWithKeyResponse) {};
   // Allows the user to add a key.
   //rpc AddKey(AddKeyRequest) returns(AddKeyResponse) {};
}

