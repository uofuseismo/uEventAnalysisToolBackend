edition = "2023";

package UEventAnalysisToolAPI.Admin.V1;

/**
 * Request for a user to step-up to an administratitve role.  This is a
 * step-up pattern so the user is already logged-in.  Consequently,
 * they pass their long-lived JWT through the Bearer credentials and
 * subsequently pass their password in the message.
 */
message LoginWithPasswordRequest {
    // The user's new password.
    string new_password = 1;
}

