edition = "2023";

package UEventAnalysisToolAPI.Admin.V1;

/**
 * Resets a user's passwords.
 */
message ResetPasswordRequest {
   // The user whose password will be reset.
   string name = 1;
   // True indicates the existing keys will also be revoked when the password
   // is reset.
   bool revoke_keys = 2;
}

