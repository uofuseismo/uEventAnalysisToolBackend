edition = "2023";

package UEventAnalysisToolAPI.Admin.V1;

import "uEventAnalysisToolAPI/admin/v1/permission.proto";

/**
 * Request to set/adjust a user's permissions in a schema.
 */
message SetPermissionRequest {
   /// The name of the user whose permissions will be adjusted.
   string name = 1;
   /// The schema.
   string schema = 2;
   /// The permissions to give to the user.
   Permission permission = 3;
}
