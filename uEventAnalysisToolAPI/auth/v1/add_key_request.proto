edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;

/**
 * Allows the user to add their PUBLIC key.  Their user name and password
 * are specified in the in the Authorization header.
 */
message AddKeyRequest {
   // The key algorithm.
   enum Algorithm {
      // Key algorithm not set - this is not valid.
      ALGORITHM_NOT_SPECIFIED = 0;
      // This is an ed25519 key.
      ALGORITHM_ED25519 = 1;
   }

   // The name of the key - e.g., sams-laptop
   string name = 1;
   // The public key.
   string public_key = 2;
   // The key algorithm.
   Algorithm algorithm = 3;
}
