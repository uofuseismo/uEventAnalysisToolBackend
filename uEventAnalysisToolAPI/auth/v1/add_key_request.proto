edition = "2023";
import "google/protobuf/duration.proto";

package UEventAnalysisToolAPI.Auth.V1;

import "uEventAnalysisToolAPI/auth/v1/signature_algorithm.proto";

/**
 * Allows the user to add their PUBLIC key.  Their user name and password
 * are specified in the in the Authorization header.
 */
message AddKeyRequest {
   // The name of the key - e.g., sams-laptop
   string name = 1;
   // The public key.
   bytes public_key = 2;
   // An assertion to prove possession of a corresponding private key.
   // The assertion's audience is <issuer>/keys.
   string assertion = 3;
   // When the user would like their key to expire.  If this is UNDEFINED
   // the key expiration will be determined by the backend configuration.  
   // The best use case for using this will be very short-lived keys
   // (e.g., days).
   google.protobuf.Duration expires_after = 4;
   // The key algorithm.
   SignatureAlgorithm algorithm = 5;
}
