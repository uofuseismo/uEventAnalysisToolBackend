edition = "2023";

package UEventAnalysisToolAPI.Auth.V1;


// The key signing algorithm.
enum SignatureAlgorithm {
   // Key signature algorithm is not set - this is not valid.
   SIGNATURE_ALGORITHM_NOT_SPECIFIED = 0;
   // This is an ed25519 key signature algorithm.
   SIGNATURE_ALGORITHM_ED25519 = 1;
}   

